services:
  postgres:
    image: postgres:16-alpine
    container_name: supportpilot-verification-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SUPPORTPILOT_POSTGRES_DB:-supportpilot_verification}
      POSTGRES_USER: ${SUPPORTPILOT_POSTGRES_USER:-supportpilot}
      POSTGRES_PASSWORD: ${SUPPORTPILOT_POSTGRES_PASSWORD:?Set SUPPORTPILOT_POSTGRES_PASSWORD in .env.docker.local}
    ports:
      - "127.0.0.1:${SUPPORTPILOT_POSTGRES_PORT:-54329}:5432"
    volumes:
      - supportpilot_verification_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  supportpilot_verification_postgres_data:
